name: Daily Notification

# 09:00 Asia/Kolkata = 03:30 UTC (IST is UTC+5:30, no daylight saving).
# GitHub Actions cron is always UTC — if you change NOTIFICATION_TIME in
# the backend's .env, update this cron expression to match.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  send-daily-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend's send-daily endpoint
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/send-daily" \
            -H "x-scheduler-secret: ${{ secrets.SCHEDULER_SECRET }}"

# This workflow only works once the backend is deployed publicly (Stage 8).
# Until then, it will fail on every scheduled run — that's expected, and
# fine, since we're still testing locally with curl (see the README).
#
# Once deployed, add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   BACKEND_URL       = e.g. https://your-app.onrender.com
#   SCHEDULER_SECRET  = the same value as SCHEDULER_SECRET in backend/.env
