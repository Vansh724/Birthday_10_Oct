<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>...</title>

  <link rel="stylesheet" href="../css/secret.css">
</head>

<body>

  <div id="experience">

    <!-- INTRO -->
    <section id="intro" class="screen active">

      <div class="intro-text">
        <p class="line line-1">You weren't supposed to find this yet.</p>
        <p class="line line-2">But since you're here...</p>
      </div>

      <button id="startButton" class="glow-button" aria-label="Start">
        <span></span>
      </button>

      <p id="pressText">press it.</p>

    </section>


    <!-- MUSIC EXPERIENCE -->
    <section id="musicScreen" class="screen">

      <canvas id="visualizer"></canvas>

      <div class="music-overlay">

        <div id="musicStatus">
          <span class="pulse-dot"></span>
          <span>listen</span>
        </div>

        <div id="tinyMessage">
          headphones recommended.
        </div>

      </div>

    </section>


    <!-- MICROPHONE -->
    <section id="micScreen" class="screen">

      <div class="mic-content">

        <p class="small-text">Okay.</p>

        <h1>Now you.</h1>

        <p class="mic-subtitle">
          MAKE SOME NOISE
        </p>

        <button id="micButton" class="mic-button">
          <span class="mic-icon">◉</span>
        </button>

        <p id="micStatus">
          tap to continue
        </p>

      </div>

      <canvas id="micVisualizer"></canvas>

    </section>


    <!-- END -->
    <section id="ending" class="screen">

      <div id="endingPoint"></div>

      <div id="finalMessage">

        <div class="final-number">10</div>

        <p>
          Not everything needs a reason.
        </p>

        <p>
          Some things are just made<br>
          because someone crossed your mind.
        </p>

      </div>

    </section>

  </div>


  <audio id="music" preload="auto">
    <source src="../audio/secret.mp3" type="audio/mpeg">
  </audio>


  <script src="../js/secret.js"></script>

</body>
</html>
